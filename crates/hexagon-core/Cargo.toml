[package]
name = "hexagon-core"
description = "Hexagon-Bot 核：全部业务逻辑（编排、回合、产物、权限、用量、轨迹）所在"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
fastembed = { version = "=7.1.0", default-features = false, features = ["ort-download-binaries-native-tls"] }
getrandom = "0.3"
globset = "0.4"
ignore = "0.4.33"
jsonschema = { version = "0.57", default-features = false }
keyring = "3"
log = "0.4.34"
libc = "0.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tiktoken-rs = "=0.12.0"
toml = "0.8"
ts-rs = "=11.1.0"
url = "2"
ureq = { version = "3", features = ["json"] }
zip = { version = "2.4", default-features = false }

[dev-dependencies]
proptest = "1.11.0"

[build-dependencies]
sha2 = "0.10"
