[package]
name = "hexagon-core"
description = "Hexagon-Bot 核：全部业务逻辑（编排、回合、产物、权限、用量、轨迹）所在"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
quick-xml = "0.42"
png = "0.18"
getrandom = "0.3"
globset = "0.4"
# 票 17：头像服务端中心裁方要解码 png/jpeg/webp/gif；只开这四种格式，不带 rayon。
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
ignore = "0.4.33"
jsonschema = { version = "0.57", default-features = false }
keyring = "3"
log = "0.4.34"
libc = "0.2"
libloading = "0.8"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tiktoken-rs = "=0.12.0"
toml = "0.8"
ts-rs = "=11.1.0"
url = "2"
ureq = { version = "3", features = ["json"] }
zip = { version = "2.4", default-features = false }

# Managed-followups ticket 02: host_fs_trash uses the system Trash API so
# "Put Back" works; only macOS is supported (ADR0087).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL", "NSBundle", "NSArray", "NSDictionary", "NSData", "NSEnumerator", "NSGeometry", "objc2-core-foundation"] }
# owner-followups-1015 #31「打开方式」：NSWorkspace 探测能打开某路径的应用 + 取应用图标。
# objc2 / objc2-app-kit 已随 tauri（wry/tao）在锁文件里，同版本直接依赖，不引新包。
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "NSGraphics", "objc2-core-foundation"] }

[dev-dependencies]
proptest = "1.11.0"

[build-dependencies]
sha2 = "0.10"
