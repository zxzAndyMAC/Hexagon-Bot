name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --prefix ui
      - name: Verify sandbox and process fixtures before the full suite
        run: >-
          cargo test -p hexagon-core -- --exact --no-capture
          sandbox::tests::seatbelt_confines_writes
          api::tests::sandbox_node_child_processes_and_npm_complete
          api::tests::sandbox_large_hardlink_inventory_keeps_exact_denials
          api::tests::mcp_deadline_detached_descendant_cannot_outlive_service
          api::tests::subagent_test_processes_cannot_modify_source_or_host_state
          tools::tests::timeout_kills_and_traces
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hexagon-retrieval-model
          key: embeddinggemma-5090578-q4-v1
      - name: Verify offline multilingual retrieval with pinned public weights
        env:
          HEXAGON_EMBEDDING_MODEL_DIR: ${{ runner.temp }}/hexagon-retrieval-model
        run: |
          python3 scripts/install-retrieval-model.py --directory "$HEXAGON_EMBEDDING_MODEL_DIR"
          cargo test -p hexagon-core local_similarity_multilingual_model -- --nocapture
      # reliability 01: same entrypoints locally and in CI, including architecture,
      # tokens, seven-language keys and regenerated DTO drift.
      - run: npm run check
      - run: npm test
      - run: npm --prefix ui run build

  linux-isolation:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      # reliability 03: installed bwrap is insufficient for the sensitive-read
      # contract. Assert refusal with no effects; do not claim Linux isolation.
      - run: cargo test -p hexagon-core terminal_linux_rejects_unenforceable_read_scope
