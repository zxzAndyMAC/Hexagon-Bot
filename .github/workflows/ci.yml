name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --prefix ui
      # 2026-09-29 hosted-runner incident: 992 preinstalled Homebrew hardlinks
      # produced 119 KB of deny rules, exceeding the 64 KiB fail-closed limit.
      # Normalize only this disposable runner's runtime files; production limits
      # and hardlink attack fixtures stay intact. No skipped isolation tests.
      - name: Make hosted Homebrew runtime files independent
        run: |
          python3 - <<'PY'
          import os, pathlib, shutil, stat, tempfile
          root = pathlib.Path('/opt/homebrew')
          pending, copied = ([root] if root.exists() else []), 0
          while pending:
              for entry in os.scandir(pending.pop()):
                  meta = entry.stat(follow_symlinks=False)
                  if stat.S_ISDIR(meta.st_mode):
                      pending.append(entry.path)
                  elif stat.S_ISREG(meta.st_mode) and meta.st_nlink > 1:
                      fd, temporary = tempfile.mkstemp(dir=os.path.dirname(entry.path))
                      os.close(fd)
                      try:
                          shutil.copy2(entry.path, temporary)
                          os.replace(temporary, entry.path)
                          copied += 1
                      finally:
                          if os.path.exists(temporary):
                              os.unlink(temporary)
          print('Independent Homebrew runtime copies:', copied)
          PY
      - name: Verify macOS sandbox before the full suite
        run: cargo test -p hexagon-core sandbox::tests::seatbelt_confines_writes -- --exact --nocapture
      # reliability 01: same entrypoints locally and in CI, including architecture,
      # tokens, seven-language keys and regenerated DTO drift.
      - run: npm run check
      - run: npm test
      - run: npm --prefix ui run build

  linux-isolation:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      # reliability 03: installed bwrap is insufficient for the sensitive-read
      # contract. Assert refusal with no effects; do not claim Linux isolation.
      - run: cargo test -p hexagon-core terminal_linux_rejects_unenforceable_read_scope
